name: Build Orange-WiFi OS for Orange Pi One

on:
workflow_dispatch:
push:
paths:
- ".github/workflows/build-orange-wifi.yml"

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-24.04
timeout-minutes: 360

steps:
  - name: Checkout Orange-WiFi source
    uses: actions/checkout@v4

  - name: Install build prerequisites
    run: |
      sudo apt-get update
      sudo apt-get install -y \
        git curl wget rsync \
        qemu-user-static binfmt-support \
        p7zip-full

  - name: Clone Armbian build framework
    run: |
      git clone --depth=1 \
        https://github.com/armbian/build.git \
        armbian-build

  - name: Add Orange-WiFi source to image
    run: |
      set -eu

      mkdir -p \
        armbian-build/userpatches/overlay/opt/orange-wifi

      rsync -a \
        --exclude='.git/' \
        --exclude='.github/' \
        --exclude='.env' \
        --exclude='*.img' \
        --exclude='*.zip' \
        --exclude='*.apk' \
        --exclude='__pycache__/' \
        --exclude='node_modules/' \
        ./ \
        armbian-build/userpatches/overlay/opt/orange-wifi/

      test -f \
        armbian-build/userpatches/overlay/opt/orange-wifi/README.md

  - name: Prepare image customization
    run: |
      cat > armbian-build/userpatches/customize-image.sh <<'SCRIPT'
      #!/bin/bash
      set -e
      export DEBIAN_FRONTEND=noninteractive

      apt-get update
      apt-get install -y --no-install-recommends \
        php-cli php-fpm php-curl php-sqlite3 \
        php-xml php-mbstring php-gd \
        lighttpd nginx \
        hostapd dnsmasq nftables \
        iproute2 iw wireless-tools \
        curl ca-certificates \
        python3 python3-pip \
        sqlite3 sudo

      mkdir -p /etc/orange-wifi
      cat > /etc/orange-wifi/BUILD-INFO <<'EOF'
      Orange-WiFi for Orange Pi One
      Base: Armbian minimal
      Debian: Trixie
      Source: /opt/orange-wifi
      Note: Application configuration and hardware testing required.
      EOF

      apt-get clean
      rm -rf /var/lib/apt/lists/*
      SCRIPT

      chmod +x \
        armbian-build/userpatches/customize-image.sh

  - name: Build Orange Pi One image
    working-directory: armbian-build
    run: |
      set -o pipefail
      ./compile.sh \
        BOARD=orangepione \
        BRANCH=current \
        RELEASE=trixie \
        BUILD_MINIMAL=yes \
        BUILD_DESKTOP=no \
        KERNEL_ONLY=no \
        KERNEL_CONFIGURE=no \
        COMPRESS_OUTPUTIMAGE=yes \
        2>&1 | tee ../orange-wifi-build.log

  - name: Upload build log
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: orange-wifi-build-log
      path: orange-wifi-build.log
      if-no-files-found: warn
      retention-days: 7

  - name: Upload flashable image
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: orange-wifi-orangepi-one-image
      path: |
        armbian-build/output/images/*.img
        armbian-build/output/images/*.img.xz
        armbian-build/output/images/*.sha
        armbian-build/output/images/*.sha256
      if-no-files-found: error
      retention-days: 14
