
name: Build Orange-WiFi for Orange Pi One

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-orange-wifi.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout Orange-WiFi
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/share/dotnet
          df -h

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl wget rsync \
            p7zip-full qemu-user-static \
            binfmt-support

      - name: Download Armbian build framework
        run: |
          git clone --depth=1 \
            https://github.com/armbian/build.git \
            armbian-build

      - name: Copy Orange-WiFi source into image overlay
        run: |
          set -eu
          mkdir -p \
            armbian-build/userpatches/overlay/home/pi/orange-wifi

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='*.img' \
            --exclude='*.zip' \
            --exclude='__pycache__/' \
            ./ \
            armbian-build/userpatches/overlay/home/pi/orange-wifi/

          test -f \
            armbian-build/userpatches/overlay/home/pi/orange-wifi/start

      - name: Configure Orange Pi One
        run: |
          cat > armbian-build/userpatches/config-orangewifi.conf <<'EOF'
          BOARD="orangepione"
          BRANCH="current"
          RELEASE="trixie"
          BUILD_MINIMAL="yes"
          BUILD_DESKTOP="no"
          KERNEL_ONLY="no"
          KERNEL_CONFIGURE="no"
          COMPRESS_OUTPUTIMAGE="yes"
          EOF

      - name: Customize target image
        run: |
          cat > armbian-build/userpatches/customize-image.sh <<'SCRIPT'
          #!/bin/bash
          set -e
          export DEBIAN_FRONTEND=noninteractive

          apt-get update
          apt-get install -y --no-install-recommends \
            php-cli php-fpm php-curl php-sqlite3 \
            php-xml php-mbstring php-gd \
            lighttpd nginx \
            hostapd dnsmasq nftables \
            iptables iproute2 iw wireless-tools \
            conntrack python3 python3-requests \
            curl ca-certificates sqlite3 \
            sudo g++ make pkg-config \
            openbox xserver-xorg

          mkdir -p /home/pi/orange-wifi
          cp -a /tmp/overlay/home/pi/orange-wifi/. \
            /home/pi/orange-wifi/
          chmod +x /home/pi/orange-wifi/start || true
          chown -R root:root /home/pi/orange-wifi

          if [ -f /home/pi/orange-wifi/orange-wifi.service ]; then
            cp /home/pi/orange-wifi/orange-wifi.service \
              /etc/systemd/system/orange-wifi.service
            sed -i \
              's|/home/pi/orange-wifi/start|/home/pi/orange-wifi/start|' \
              /etc/systemd/system/orange-wifi.service
          fi

          if [ -f /home/pi/orange-wifi/silvasystems-kicker.service ]; then
            cp /home/pi/orange-wifi/silvasystems-kicker.service \
              /etc/systemd/system/silvasystems-kicker.service
          fi

          cat > /etc/orange-wifi-build-info <<'EOF'
          Board: Orange Pi One
          Base: Armbian minimal
          Source: /home/pi/orange-wifi
          Network interfaces and startup services need configuration
          and hardware testing before production use.
          EOF

          apt-get clean
          rm -rf /var/lib/apt/lists/*
          SCRIPT

          chmod +x \
            armbian-build/userpatches/customize-image.sh

      - name: Build image
        working-directory: armbian-build
        run: |
          set -o pipefail
          ./compile.sh orangewifi \
            2>&1 | tee ../orange-wifi-build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orange-wifi-build-log
          path: orange-wifi-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload image files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: orange-wifi-orangepi-one-image
          path: armbian-build/output/images/*
          if-no-files-found: error
          retention-days: 14
          
