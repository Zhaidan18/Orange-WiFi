
name: Build Piso WiFi OS - Orange Pi One

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-pisowifi-image.yml"
      - "main.py"
      - "network_controller.py"
      - "requirements.txt"
      - "templates/**"
      - "config/**"

permissions:
  contents: read

concurrency:
  group: pisowifi-orange-pi-one-build
  cancel-in-progress: false

jobs:
  build-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout Piso WiFi fork
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/share/dotnet
          df -h

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl wget rsync \
            p7zip-full qemu-user-static \
            binfmt-support
          df -h

      - name: Get Armbian build framework
        run: |
          git clone --depth=1 \
            https://github.com/armbian/build.git \
            armbian-build

      - name: Prepare Piso WiFi application overlay
        run: |
          set -eu

          mkdir -p \
            armbian-build/userpatches/overlay/opt/pisowifi

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='.venv/' \
            --exclude='venv/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='node_modules/' \
            ./ \
            armbian-build/userpatches/overlay/opt/pisowifi/

          test -f \
            armbian-build/userpatches/overlay/opt/pisowifi/main.py

      - name: Configure target image
        run: |
          mkdir -p armbian-build/userpatches

          cat > armbian-build/userpatches/config-pisowifi.conf <<'EOF'
          BOARD="orangepione"
          BRANCH="current"
          RELEASE="trixie"
          BUILD_MINIMAL="yes"
          BUILD_DESKTOP="no"
          KERNEL_ONLY="no"
          KERNEL_CONFIGURE="no"
          COMPRESS_OUTPUTIMAGE="yes"
          EOF

      - name: Configure Piso WiFi inside image
        run: |
          cat > armbian-build/userpatches/customize-image.sh <<'SCRIPT'
          #!/bin/bash
          set -e

          export DEBIAN_FRONTEND=noninteractive

          apt-get update
          apt-get install -y --no-install-recommends \
            hostapd dnsmasq nftables \
            python3 python3-venv python3-pip \
            python3-flask python3-werkzeug \
            iproute2 iw wireless-tools \
            curl ca-certificates sqlite3 \
            gpiod

          APP=/opt/pisowifi
          test -f "$APP/main.py"

          if [ -f "$APP/requirements.txt" ]; then
            python3 -m venv --system-site-packages \
              "$APP/.venv"

            "$APP/.venv/bin/pip" install \
              --no-cache-dir \
              -r "$APP/requirements.txt"
          fi

          # Do not activate AP/DHCP before network configuration.
          systemctl disable hostapd.service 2>/dev/null || true
          systemctl disable dnsmasq.service 2>/dev/null || true

          PYTHON=/usr/bin/python3
          if [ -x "$APP/.venv/bin/python" ]; then
            PYTHON="$APP/.venv/bin/python"
          fi

          cat > /etc/systemd/system/pisowifi.service <<EOF
          [Unit]
          Description=Piso WiFi Application
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          WorkingDirectory=/opt/pisowifi
          Environment=PYTHONUNBUFFERED=1
          ExecStart=$PYTHON /opt/pisowifi/main.py
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          EOF

          systemctl enable pisowifi.service

          mkdir -p /etc/pisowifi
          cat > /etc/pisowifi/README <<'EOF'
          Piso WiFi Orange Pi One
          Application: /opt/pisowifi
          Service: pisowifi.service

          Configure Wi-Fi, WAN/LAN, DHCP, DNS, firewall,
          captive portal and coin acceptor GPIO before use.
          Change default credentials before deployment.
          EOF

          apt-get clean
          rm -rf /var/lib/apt/lists/*
          SCRIPT

          chmod +x \
            armbian-build/userpatches/customize-image.sh

      - name: Build Orange Pi One OS image
        working-directory: armbian-build
        run: |
          set -o pipefail

          ./compile.sh \
            BOARD=orangepione \
            BRANCH=current \
            RELEASE=trixie \
            BUILD_MINIMAL=yes \
            BUILD_DESKTOP=no \
            KERNEL_ONLY=no \
            KERNEL_CONFIGURE=no \
            COMPRESS_OUTPUTIMAGE=yes \
            2>&1 | tee ../armbian-build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pisowifi-build-log
          path: armbian-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload flashable image
        uses: actions/upload-artifact@v4
        with:
          name: pisowifi-orangepi-one-image
          path: |
            armbian-build/output/images/*.img
            armbian-build/output/images/*.img.xz
            armbian-build/output/images/*.sha
            armbian-build/output/images/*.sha256
          if-no-files-found: error
          retention-days: 14

